name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift-build:
    name: Swift build
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install espeak-ng
        run: brew install espeak-ng

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
